# Reserve space for the floating Caelestia TopBar on all monitors.
# Bar: 12px top inset + 34px capsule; reserve 60px for a comfortable gap.
# Only tiled/maximized layout is affected; manually floating windows remain movable.
# Syntax for Hyprland 0.53.x: monitor = name, addreserved, TOP, BOTTOM, LEFT, RIGHT
monitor = , addreserved, 60, 0, 0, 0
