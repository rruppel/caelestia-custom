# macOS-inspired Hyprbars — tested against the configuration options in 0.53.x.
# Traffic lights appear on the LEFT; titles remain centered.
# The plugin itself must already be loaded by Hyprland/hyprpm.
#
# Red: close active window.
# Yellow: send window to existing special:magic scratchpad (Super+S recalls it).
# Green: toggle maximized fullscreen mode 1.
# IMPORTANT: special:magic is NOT conventional minimize.
plugin {
    hyprbars {
        enabled = true
        bar_height = 30
        bar_color = rgba(1b2941ee)
        bar_blur = true
        bar_title_enabled = true
        col.text = rgb(e6f0ff)
        bar_text_font = Rubik
        bar_text_size = 11
        bar_text_align = center
        bar_buttons_alignment = left
        bar_part_of_window = true
        bar_precedence_over_border = false
        bar_padding = 11
        bar_button_padding = 7
        icon_on_hover = true
        inactive_button_color = rgba(8290a8bb)
        on_double_click = hyprctl dispatch fullscreen 1

        # Left-to-right when bar_buttons_alignment = left:
        # size, symbol, click command, and symbol color.
        hyprbars-button = rgb(ff5f57), 13, ×, hyprctl dispatch killactive, rgb(49262c)
        hyprbars-button = rgb(febc2e), 13, −, hyprctl dispatch movetoworkspacesilent special:magic, rgb(58400e)
        hyprbars-button = rgb(28c840), 13, +, hyprctl dispatch fullscreen 1, rgb(153f23)
    }
}
